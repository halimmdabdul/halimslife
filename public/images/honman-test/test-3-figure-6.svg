<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">Figure 6 time-limited parking</title><desc id="desc">A blue parking sign valid from 8 to 20 for a maximum of 60 minutes.</desc><rect width="760" height="470" fill="#fafbfc"/><circle cx="380" cy="235" r="195" fill="#fff" stroke="#073b8d" stroke-width="5"/><circle cx="380" cy="235" r="179" fill="#0752a0"/><text x="380" y="130" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#fff">8-20</text><text x="330" y="310" text-anchor="middle" font-family="sans-serif" font-size="190" fill="#fff">P</text><text x="500" y="320" text-anchor="middle" font-family="sans-serif" font-size="82" fill="#fff">60</text><text x="500" y="355" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#fff">min</text></svg>
